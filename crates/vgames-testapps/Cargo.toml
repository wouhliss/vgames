[package]
name = "vgames-testapps"
description = "Windows test games for compat and overlay tests: draw a known colour for N frames, read it back, exit 0 (a non-zero code names the failing step)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "vgames-testapp-d3d11"
path = "src/bin/d3d11.rs"

[[bin]]
name = "vgames-testapp-d3d12"
path = "src/bin/d3d12.rs"

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Direct3D12",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
