[package]
name = "vgames-core"
description = "vgames wire formats and cryptography: manifests, trust bundles, signatures, path safety. No I/O, WASM-compatible."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
# Browser builds (admin-web packer worker). Enables the JS entropy source.
wasm = ["getrandom/wasm_js", "uuid/js"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
time.workspace = true
hex.workspace = true
base64.workspace = true
blake3.workspace = true
ed25519-dalek.workspace = true
argon2.workspace = true
chacha20poly1305.workspace = true
getrandom.workspace = true
zeroize.workspace = true
unicode-normalization.workspace = true

[dev-dependencies]
proptest.workspace = true
insta.workspace = true

[lints]
workspace = true
