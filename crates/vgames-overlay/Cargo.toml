[package]
name = "vgames-overlay"
description = "In-game overlay: renderer injected into games (Windows DLL via hudhook, Vulkan implicit layer, Linux GL preload) and the IPC protocol shared with the launcher broker."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["rlib", "cdylib"]

# A native GL "game" for tests/gl_preload.rs (never shipped).
[[bin]]
name = "vgames-gl-testapp"
path = "src/bin/vgames-gl-testapp.rs"
required-features = ["renderer"]

[features]
default = []
# Build the in-game renderer (broker link, CPU-drawn cards, Vulkan layer). The launcher
# depends on this crate without it, for the IPC protocol types only.
renderer = ["dep:ash", "dep:font8x8", "dep:libc"]

[dependencies]
serde.workspace = true
thiserror.workspace = true
postcard.workspace = true
uuid.workspace = true
ash = { workspace = true, optional = true }
font8x8 = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = { workspace = true, optional = true }

[dev-dependencies]
ash.workspace = true
libloading.workspace = true
proptest.workspace = true

[lints]
workspace = true
