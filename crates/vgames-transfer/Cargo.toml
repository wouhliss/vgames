[package]
name = "vgames-transfer"
description = "Native transfer engines: parallel range downloads written straight to disk, parallel resumable uploads to GCS."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
# Test support shared with other crates' tests: signed test packages, a loopback
# storage rig with fault injection, and a mock API. Never enabled in release builds.
testkit = ["dep:tempfile"]

[dependencies]
vgames-core.workspace = true
vgames-pack.workspace = true
vgames-proto.workspace = true
uuid.workspace = true
time.workspace = true
hex.workspace = true
getrandom.workspace = true
tokio.workspace = true
tokio-util.workspace = true
futures-util.workspace = true
bytes.workspace = true
reqwest.workspace = true
zstd.workspace = true
blake3.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
cap-std.workspace = true
cap-fs-ext.workspace = true
tempfile = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO"] }

[dev-dependencies]
vgames-api.workspace = true
axum.workspace = true
sqlx.workspace = true
vgames-transfer = { path = ".", features = ["testkit"] }
tempfile.workspace = true
wiremock.workspace = true
proptest.workspace = true
criterion.workspace = true

[lints]
workspace = true
