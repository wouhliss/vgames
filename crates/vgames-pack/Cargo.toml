[package]
name = "vgames-pack"
description = "Deterministic packer: scans a folder, plans chunks and packs, hashes and builds a vgames manifest. Native and WASM."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = ["zstd"]
# Per-chunk zstd (encode with `compression = auto`, decode when verifying).
# Off in the browser build: the browser packer always stores chunks raw.
zstd = ["dep:zstd"]
# wasm-bindgen API consumed by apps/admin-web's upload worker.
wasm = ["vgames-core/wasm", "dep:wasm-bindgen", "dep:js-sys", "dep:serde-wasm-bindgen"]

[dependencies]
vgames-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
blake3.workspace = true
hex.workspace = true
uuid.workspace = true
time.workspace = true
unicode-normalization.workspace = true
zstd = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }
serde-wasm-bindgen = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
walkdir.workspace = true

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
insta.workspace = true

[lints]
workspace = true

# Recent rustc emits bulk-memory, non-trapping float-to-int and sign-ext by default;
# wasm-opt must be told to accept them.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O", "--enable-bulk-memory", "--enable-nontrapping-float-to-int", "--enable-sign-ext", "--enable-mutable-globals", "--enable-reference-types", "--enable-multivalue"]
