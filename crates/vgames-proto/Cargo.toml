[package]
name = "vgames-proto"
description = "Typed DTOs for the vgames HTTP API and realtime (WebSocket) events, shared by the API server and the desktop launcher."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
# Derives utoipa::ToSchema so the API can generate its OpenAPI document from these types.
openapi = ["dep:utoipa"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
time.workspace = true
utoipa = { workspace = true, optional = true }

[lints]
workspace = true
