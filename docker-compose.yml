# Local development dependencies for vgames.
#   docker compose up -d            # Postgres + GCS emulator
#   cargo run -p vgames-api         # API on :8080 (reads .env)
#
# Production infrastructure (Cloud SQL / managed Postgres, real GCS buckets,
# secrets) is provisioned by humans: see infra/README.md.
name: vgames

services:
  postgres:
    # PostgreSQL 18+ is required: migrations use the built-in uuidv7().
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vgames
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vgames-dev-only}
      POSTGRES_DB: vgames
      POSTGRES_INITDB_ARGS: "--data-checksums"
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - log_min_duration_statement=250
      - -c
      - log_lock_waits=on
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/<major>/docker.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vgames -d vgames"]
      interval: 5s
      timeout: 3s
      retries: 20

  gcs:
    # GCS emulator for integration tests of the GCS storage backend. Unit tests
    # and day-to-day dev can use VGAMES_STORAGE_BACKEND=fs instead.
    # The emulator does not enforce signed-URL signatures: signing is covered by
    # unit tests against Google's published V4 test vectors.
    image: fsouza/fake-gcs-server:1.56.1
    restart: unless-stopped
    command:
      - -scheme
      - http
      - -port
      - "4443"
      - -external-url
      - http://localhost:4443
      - -backend
      - filesystem
      - -filesystem-root
      - /storage
    ports:
      - "127.0.0.1:4443:4443"
    volumes:
      - gcsdata:/storage

volumes:
  pgdata:
  gcsdata:
