# A headless X display with a real refresh rate for the Proton job. Xvfb reports
# 0 Hz, and DXVK 2.5 divides by the refresh period (the game dies with
# 0xC0000094); the dummy driver serves this 60 Hz modeline (cvt 1280 1024 60).
Section "Device"
  Identifier "dummy"
  Driver "dummy"
  VideoRam 256000
EndSection
Section "Monitor"
  Identifier "monitor"
  HorizSync 5.0-1000.0
  VertRefresh 5.0-200.0
  Modeline "1280x1024_60" 109.00 1280 1368 1496 1712 1024 1027 1034 1063 -hsync +vsync
EndSection
Section "Screen"
  Identifier "screen"
  Device "dummy"
  Monitor "monitor"
  DefaultDepth 24
  SubSection "Display"
    Depth 24
    Modes "1280x1024_60"
  EndSubSection
EndSection
