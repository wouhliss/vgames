name: Toolchain watch
on:
  schedule:
    - cron: "17 5 * * 2"
  workflow_dispatch:
permissions: {}
concurrency:
  group: toolchain-watch
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    permissions:
      contents: read
    outputs:
      pin: ${{ steps.version.outputs.pin }}
      stable: ${{ steps.version.outputs.stable }}
      newer: ${{ steps.version.outputs.newer }}
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: vgames
          POSTGRES_PASSWORD: vgames-watch-only
          POSTGRES_DB: vgames
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vgames -d vgames"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      SQLX_OFFLINE: "true"
      DATABASE_URL: postgres://vgames:vgames-watch-only@localhost:5432/vgames
      VGAMES_TEST_DATABASE_URL: postgres://vgames:vgames-watch-only@localhost:5432/vgames
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - id: version
        name: Compare exact stable versions
        run: |
          python3 - <<'PY'
          import os, subprocess, tomllib
          from pathlib import Path
          pin = tomllib.loads(Path('rust-toolchain.toml').read_text())['toolchain']['channel']
          stable = subprocess.check_output(['rustc', '+stable', '--version'], text=True).split()[1]
          newer = tuple(map(int, stable.split('.'))) > tuple(map(int, pin.split('.')))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'pin={pin}\nstable={stable}\nnewer={str(newer).lower()}\n')
          PY
      - if: steps.version.outputs.newer == 'true'
        name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libdbus-1-dev libudev-dev pkg-config build-essential
      - if: steps.version.outputs.newer == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - if: steps.version.outputs.newer == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - if: steps.version.outputs.newer == 'true'
        run: pnpm install --frozen-lockfile && pnpm --filter @vgames/desktop build
      - if: steps.version.outputs.newer == 'true'
        name: Stable fmt, clippy and tests
        run: |
          cargo +stable fmt --all -- --check
          cargo +stable clippy --workspace --all-targets --locked -- -D warnings
          xvfb-run -a cargo +stable test --workspace --locked
          cargo +stable clippy -p vgames-desktop --all-targets --locked -- -D warnings
          xvfb-run -a cargo +stable test -p vgames-desktop --locked
  report:
    needs: test
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Maintain one upgrade issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WATCH_PIN: ${{ needs.test.outputs.pin }}
          WATCH_STABLE: ${{ needs.test.outputs.stable }}
          WATCH_NEWER: ${{ needs.test.outputs.newer }}
          WATCH_RESULT: ${{ needs.test.result }}
          WATCH_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/ci/toolchain-watch.py
