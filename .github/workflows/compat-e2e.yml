# Windows test games through real compatibility runtimes (GAME-05, GAME-06). Owner: GAME.
# Proton on ubuntu-24.04 with software rendering (Xvfb, lavapipe/llvmpipe); Wine on macos-15
# (Apple silicon, Rosetta 2, Metal when the runner exposes it). The runtime
# catalog is signed by a key the test generates; the runtimes themselves are the real
# upstream releases, pinned by size and SHA-256 (scripts/ci/compat-runtimes.sh).
#
# Rules: actions pinned by SHA, no secrets beyond the read-only token, caches saved only
# from main/schedule runs.

name: Compat E2E

on:
  pull_request:
    paths:
      - "apps/desktop/src-tauri/src/compat/**"
      - "apps/desktop/src-tauri/src/launch/**"
      - "crates/vgames-testapps/**"
      - "crates/vgames-core/src/runtimes.rs"
      - "scripts/ci/compat-runtimes.sh"
      - ".github/workflows/compat-e2e.yml"
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: compat-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  SQLX_OFFLINE: "true"

jobs:
  proton:
    name: Proton (ubuntu-24.04, lavapipe)
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: System libraries (Tauri 2, mingw, Mesa, Xvfb, Xorg dummy)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libdbus-1-dev libudev-dev pkg-config build-essential xvfb \
            cmake libxss-dev libxcursor-dev libxi-dev libxfixes-dev libxrandr-dev \
            libxinerama-dev libasound2-dev libpulse-dev libwayland-dev \
            libxkbcommon-dev libegl1-mesa-dev libgles2-mesa-dev libdrm-dev \
            libgbm-dev libdecor-0-dev \
            mingw-w64 mesa-vulkan-drivers libgl1-mesa-dri vulkan-tools jq python3 \
            xserver-xorg-core xserver-xorg-video-dummy x11-xserver-utils
      - name: Allow unprivileged user namespaces (pressure-vessel)
        # Ubuntu 24.04's AppArmor blocks them; compat::preflight names this sysctl.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Vulkan device (lavapipe)
        run: xvfb-run -a vulkaninfo --summary | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustup target add x86_64-pc-windows-gnu && rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: compat-e2e
          save-if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'schedule' }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install locked dependencies for embedded notices
        run: pnpm install --frozen-lockfile
      - name: Build the Windows test games
        run: cargo build --locked --release -p vgames-testapps --target x86_64-pc-windows-gnu
      - name: Build the launcher tests
        run: cargo test --locked -p vgames-desktop --lib --no-run
      - name: The launcher's Vulkan probe sees lavapipe
        env:
          VGAMES_EXPECT_VULKAN: "1"
        run: xvfb-run -a cargo test --locked -p vgames-desktop --lib compat::preflight
      - name: The PE scan reads the real test games
        run: |
          for api in d3d11 d3d12; do
            VGAMES_PE_SAMPLE="$GITHUB_WORKSPACE/target/x86_64-pc-windows-gnu/release/vgames-testapp-$api.exe" \
            VGAMES_PE_EXPECT=$api \
            cargo test --locked -p vgames-desktop --lib compat::pe::tests::a_real_executable_is_scanned -- --ignored --nocapture
          done
      - name: Pin the upstream runtimes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/ci/compat-runtimes.sh proton > "$RUNNER_TEMP/runtimes.json"
          jq '.[] | del(.sha256)' "$RUNNER_TEMP/runtimes.json" | tee -a "$GITHUB_STEP_SUMMARY"
          jq '(.[] | select(.id == "umu-proton") | .sha256) |= (.[0:63] + (if .[63:] == "0" then "1" else "0" end))' \
            "$RUNNER_TEMP/runtimes.json" > "$RUNNER_TEMP/runtimes-tampered.json"
      - name: A tampered Proton archive is refused before extraction
        env:
          VGAMES_PROTON_E2E_RUNTIMES: ${{ runner.temp }}/runtimes-tampered.json
          VGAMES_PROTON_E2E_GAME: ${{ github.workspace }}/target/x86_64-pc-windows-gnu/release/vgames-testapp-d3d11.exe
          VGAMES_PROTON_E2E_EXPECT: refused-before-extraction
        run: >-
          xvfb-run -a cargo test --locked -p vgames-desktop --lib
          compat::plan::proton_e2e -- --ignored --nocapture
      - name: A display with a real refresh rate (Xorg dummy, 60 Hz)
        # Xvfb reports 0 Hz and DXVK divides by the refresh period, so the games
        # run on this display instead (scripts/ci/xorg-dummy.conf).
        run: |
          sudo nohup Xorg :99 -noreset -nolisten tcp -config "$GITHUB_WORKSPACE/scripts/ci/xorg-dummy.conf" \
            -logfile "$RUNNER_TEMP/xorg.log" > /dev/null 2>&1 &
          for _ in $(seq 50); do DISPLAY=:99 xrandr > /dev/null 2>&1 && break; sleep 0.2; done
          DISPLAY=:99 xrandr --current > "$RUNNER_TEMP/xrandr.txt" || { sudo cat "$RUNNER_TEMP/xorg.log"; exit 1; }
          head -n 3 "$RUNNER_TEMP/xrandr.txt"
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
      - name: The D3D11 test game runs through Proton (DXVK)
        env:
          VGAMES_PROTON_E2E_RUNTIMES: ${{ runner.temp }}/runtimes.json
          VGAMES_PROTON_E2E_DATA: ${{ runner.temp }}/launcher-data
          VGAMES_PROTON_E2E_LOG_DIR: ${{ runner.temp }}/proton-logs
          VGAMES_PROTON_E2E_GAME: ${{ github.workspace }}/target/x86_64-pc-windows-gnu/release/vgames-testapp-d3d11.exe
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
        run: >-
          cargo test --locked -p vgames-desktop --lib
          compat::plan::proton_e2e -- --ignored --nocapture
      - name: The D3D12 test game through VKD3D-Proton (attempted, recorded)
        id: d3d12
        continue-on-error: true
        env:
          VGAMES_PROTON_E2E_RUNTIMES: ${{ runner.temp }}/runtimes.json
          VGAMES_PROTON_E2E_DATA: ${{ runner.temp }}/launcher-data
          VGAMES_PROTON_E2E_LOG_DIR: ${{ runner.temp }}/proton-logs
          VGAMES_PROTON_E2E_GAME: ${{ github.workspace }}/target/x86_64-pc-windows-gnu/release/vgames-testapp-d3d12.exe
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
        run: >-
          cargo test --locked -p vgames-desktop --lib
          compat::plan::proton_e2e -- --ignored --nocapture
      - name: Proton's log of a failed run
        if: failure() || steps.d3d12.outcome == 'failure'
        run: |
          for log in "$RUNNER_TEMP"/proton-logs/*.log; do
            [ -f "$log" ] || { echo "no Proton log was written"; continue; }
            echo "== $log ($(wc -l < "$log") lines)"
            head -n 40 "$log"
            echo "== errors, exceptions, process exits and the game's own output"
            grep -E -i 'vgames test app|err:|exception|code=c0|status_|exitprocess|terminateprocess|dxvk|d3d11|dxgi|vulkan|game\.exe' "$log" \
              | grep -v -E 'trace:unwind|RtlGrowFunctionTable' | head -n 400 || true
          done
      - name: Keep Proton's logs
        if: failure() || steps.d3d12.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: proton-logs
          path: ${{ runner.temp }}/proton-logs
          if-no-files-found: ignore
      - name: Record the D3D12 result
        if: always()
        env:
          OUTCOME: ${{ steps.d3d12.outcome }}
        run: |
          echo "D3D12 through VKD3D-Proton on lavapipe: ${OUTCOME} (a lavapipe gap goes to human-checklist §B3)" \
            | tee -a "$GITHUB_STEP_SUMMARY"

  wine:
    name: Wine (macos-15 arm64)
    runs-on: macos-15
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tools (mingw, jq)
        run: brew install mingw-w64 jq
      - name: Rosetta 2 and Metal on this runner (recorded)
        run: |
          if arch -x86_64 /usr/bin/true; then echo "Rosetta 2: present"; else echo "Rosetta 2: missing"; fi | tee -a "$GITHUB_STEP_SUMMARY"
          system_profiler SPDisplaysDataType | grep -E "Metal|Chipset" | tee -a "$GITHUB_STEP_SUMMARY" || true
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustup target add x86_64-pc-windows-gnu && rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: compat-e2e-macos
          save-if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'schedule' }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install locked dependencies for embedded notices
        run: pnpm install --frozen-lockfile
      - name: Build the Windows test games
        run: cargo build --locked --release -p vgames-testapps --target x86_64-pc-windows-gnu
      - name: Rosetta detection and the Wine plan rules
        run: cargo test --locked -p vgames-desktop --lib -- compat::rosetta compat::plan::tests::wine compat::d3d
      - name: Pin the upstream runtimes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/ci/compat-runtimes.sh wine > "$RUNNER_TEMP/runtimes.json"
          jq '.[] | del(.sha256)' "$RUNNER_TEMP/runtimes.json" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: The D3D11 test game through Wine + DXMT (recorded; missing Metal goes to human-checklist §B4)
        id: dxmt
        continue-on-error: true
        env:
          VGAMES_WINE_E2E_RUNTIMES: ${{ runner.temp }}/runtimes.json
          VGAMES_WINE_E2E_GAME: ${{ github.workspace }}/target/x86_64-pc-windows-gnu/release/vgames-testapp-d3d11.exe
          VGAMES_WINE_E2E_GRAPHICS: dxmt
        run: cargo test --locked -p vgames-desktop --lib compat::plan::wine_e2e -- --ignored --nocapture
      - name: The D3D11 test game through Wine + DXVK-macOS (recorded)
        id: dxvk
        continue-on-error: true
        env:
          VGAMES_WINE_E2E_RUNTIMES: ${{ runner.temp }}/runtimes.json
          VGAMES_WINE_E2E_GAME: ${{ github.workspace }}/target/x86_64-pc-windows-gnu/release/vgames-testapp-d3d11.exe
          VGAMES_WINE_E2E_GRAPHICS: dxvk
        run: cargo test --locked -p vgames-desktop --lib compat::plan::wine_e2e -- --ignored --nocapture
      - name: The D3D11 test game through Wine + wined3d (recorded)
        id: wined3d
        continue-on-error: true
        env:
          VGAMES_WINE_E2E_RUNTIMES: ${{ runner.temp }}/runtimes.json
          VGAMES_WINE_E2E_GAME: ${{ github.workspace }}/target/x86_64-pc-windows-gnu/release/vgames-testapp-d3d11.exe
          VGAMES_WINE_E2E_GRAPHICS: wined3d
        run: cargo test --locked -p vgames-desktop --lib compat::plan::wine_e2e -- --ignored --nocapture
      - name: Record the Metal backends
        if: always()
        env:
          DXMT: ${{ steps.dxmt.outcome }}
          DXVK: ${{ steps.dxvk.outcome }}
          WINED3D: ${{ steps.wined3d.outcome }}
        run: |
          echo "Wine + DXMT: ${DXMT}; Wine + DXVK-macOS: ${DXVK}; Wine + wined3d: ${WINED3D} (failures without Metal go to human-checklist §B4)" \
            | tee -a "$GITHUB_STEP_SUMMARY"
