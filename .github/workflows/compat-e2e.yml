# Windows test games through real compatibility runtimes (GAME-05). Owner: GAME.
# Proton on ubuntu-24.04 with software rendering (Xvfb, lavapipe/llvmpipe). The runtime
# catalog is signed by a key the test generates; the runtimes themselves are the real
# upstream releases, pinned by size and SHA-256 (scripts/ci/proton-runtimes.sh).
#
# Rules: actions pinned by SHA, no secrets beyond the read-only token, caches saved only
# from main/schedule runs.

name: Compat E2E

on:
  pull_request:
    paths:
      - "apps/desktop/src-tauri/src/compat/**"
      - "apps/desktop/src-tauri/src/launch/**"
      - "crates/vgames-testapps/**"
      - "crates/vgames-core/src/runtimes.rs"
      - "scripts/ci/proton-runtimes.sh"
      - ".github/workflows/compat-e2e.yml"
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: compat-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  SQLX_OFFLINE: "true"

jobs:
  proton:
    name: Proton (ubuntu-24.04, lavapipe)
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: System libraries (Tauri 2, mingw, Mesa, Xvfb)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libdbus-1-dev libudev-dev pkg-config build-essential xvfb \
            cmake libxss-dev libxcursor-dev libxi-dev libxfixes-dev libxrandr-dev \
            libxinerama-dev libasound2-dev libpulse-dev libwayland-dev \
            libxkbcommon-dev libegl1-mesa-dev libgles2-mesa-dev libdrm-dev \
            libgbm-dev libdecor-0-dev \
            mingw-w64 mesa-vulkan-drivers libgl1-mesa-dri vulkan-tools jq python3
      - name: Allow unprivileged user namespaces (pressure-vessel)
        # Ubuntu 24.04's AppArmor blocks them; compat::preflight names this sysctl.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Vulkan device (lavapipe)
        run: xvfb-run -a vulkaninfo --summary | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustup target add x86_64-pc-windows-gnu && rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: compat-e2e
          save-if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'schedule' }}
      - name: Build the Windows test games
        run: cargo build --locked --release -p vgames-testapps --target x86_64-pc-windows-gnu
      - name: Build the launcher tests
        run: cargo test --locked -p vgames-desktop --lib --no-run
      - name: The launcher's Vulkan probe sees lavapipe
        env:
          VGAMES_EXPECT_VULKAN: "1"
        run: xvfb-run -a cargo test --locked -p vgames-desktop --lib compat::preflight
      - name: Pin the upstream runtimes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/ci/proton-runtimes.sh > "$RUNNER_TEMP/runtimes.json"
          jq '.[] | del(.sha256)' "$RUNNER_TEMP/runtimes.json" | tee -a "$GITHUB_STEP_SUMMARY"
          jq '(.[] | select(.id == "umu-proton") | .sha256) |= (.[0:63] + (if .[63:] == "0" then "1" else "0" end))' \
            "$RUNNER_TEMP/runtimes.json" > "$RUNNER_TEMP/runtimes-tampered.json"
      - name: A tampered Proton archive is refused before extraction
        env:
          VGAMES_PROTON_E2E_RUNTIMES: ${{ runner.temp }}/runtimes-tampered.json
          VGAMES_PROTON_E2E_GAME: ${{ github.workspace }}/target/x86_64-pc-windows-gnu/release/vgames-testapp-d3d11.exe
          VGAMES_PROTON_E2E_EXPECT: refused-before-extraction
        run: >-
          xvfb-run -a cargo test --locked -p vgames-desktop --lib
          compat::plan::proton_e2e -- --ignored --nocapture
      - name: The D3D11 test game runs through Proton (DXVK)
        env:
          VGAMES_PROTON_E2E_RUNTIMES: ${{ runner.temp }}/runtimes.json
          VGAMES_PROTON_E2E_DATA: ${{ runner.temp }}/launcher-data
          VGAMES_PROTON_E2E_LOG_DIR: ${{ runner.temp }}/proton-logs
          VGAMES_PROTON_E2E_GAME: ${{ github.workspace }}/target/x86_64-pc-windows-gnu/release/vgames-testapp-d3d11.exe
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
        run: >-
          xvfb-run -a -s "-screen 0 1280x1024x24" cargo test --locked -p vgames-desktop --lib
          compat::plan::proton_e2e -- --ignored --nocapture
      - name: The D3D12 test game through VKD3D-Proton (attempted, recorded)
        id: d3d12
        continue-on-error: true
        env:
          VGAMES_PROTON_E2E_RUNTIMES: ${{ runner.temp }}/runtimes.json
          VGAMES_PROTON_E2E_DATA: ${{ runner.temp }}/launcher-data
          VGAMES_PROTON_E2E_LOG_DIR: ${{ runner.temp }}/proton-logs
          VGAMES_PROTON_E2E_GAME: ${{ github.workspace }}/target/x86_64-pc-windows-gnu/release/vgames-testapp-d3d12.exe
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
        run: >-
          xvfb-run -a -s "-screen 0 1280x1024x24" cargo test --locked -p vgames-desktop --lib
          compat::plan::proton_e2e -- --ignored --nocapture
      - name: Proton's log of a failed run
        if: failure() || steps.d3d12.outcome == 'failure'
        run: |
          for log in "$RUNNER_TEMP"/proton-logs/*.log; do
            [ -f "$log" ] || { echo "no Proton log was written"; continue; }
            echo "== $log ($(wc -l < "$log") lines)"
            head -n 40 "$log"
            echo "== errors, exceptions, process exits and the game's own output"
            grep -E -i 'vgames test app|err:|exception|code=c0|status_|exitprocess|terminateprocess|dxvk|d3d11|dxgi|vulkan|game\.exe' "$log" \
              | grep -v -E 'trace:unwind|RtlGrowFunctionTable' | head -n 400 || true
          done
      - name: Keep Proton's logs
        if: failure() || steps.d3d12.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: proton-logs
          path: ${{ runner.temp }}/proton-logs
          if-no-files-found: ignore
      - name: Record the D3D12 result
        if: always()
        env:
          OUTCOME: ${{ steps.d3d12.outcome }}
        run: |
          echo "D3D12 through VKD3D-Proton on lavapipe: ${OUTCOME} (a lavapipe gap goes to human-checklist §B3)" \
            | tee -a "$GITHUB_STEP_SUMMARY"
