name: Diag macOS URL handler (throwaway, PR #273)
on:
  push:
    branches: [play/diag-macos-url-handler]
permissions:
  contents: read
jobs:
  diag:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash diag/run.sh
