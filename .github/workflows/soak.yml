# Hosted launcher and social soaks (INT-07 / GAME-13).
# Binaries are built once before the 358-minute measurement jobs start.
# The optional legacy 24-hour self-hosted job remains separate; it is not hosted acceptance.

name: Soak

on:
  schedule:
    - cron: "7 1 * * 6"
  workflow_dispatch:
    inputs:
      hours:
        description: Duration in hours
        default: "24"
        required: true
      hosted_hours:
        description: Hosted launcher soak hours (0.1-5.5; short runs are diagnostics)
        default: "5.5"
        required: true
      chat_secs:
        description: Social chat soak, seconds
        default: "3600"
        required: true
      idle_secs:
        description: Social idle soak, seconds (hosted jobs stop at 6 h)
        default: "19800"
        required: true

permissions: {}

concurrency:
  group: soak
  cancel-in-progress: false

jobs:
  build:
    name: Build release launcher and social soak binaries
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      SQLX_OFFLINE: "true"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: System libraries (Tauri 2 on Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            cmake libxss-dev libxcursor-dev libxi-dev libxfixes-dev libxrandr-dev \
            libxinerama-dev libasound2-dev libpulse-dev libwayland-dev \
            libxkbcommon-dev libegl1-mesa-dev libgles2-mesa-dev libdrm-dev \
            libgbm-dev libdecor-0-dev \
            libdbus-1-dev libudev-dev pkg-config build-essential
      - name: Install toolchain
        run: rustup toolchain install
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Validate the observer
        run: python3 -m unittest discover -s apps/desktop/perf -p test_soak.py
      - run: pnpm --filter @vgames/desktop build
      - name: Build once, before the hosted time budgets start
        run: |
          cargo build --locked --release -p vgames-desktop --features tauri/custom-protocol
          cargo test --locked -p vgames-desktop --test social_soak --no-run --message-format json > "$RUNNER_TEMP/soak-build.jsonl"
          python3 - <<'PY_BUILD'
          import json, os, shutil
          from pathlib import Path
          temporary = Path(os.environ["RUNNER_TEMP"])
          artifacts = [json.loads(line) for line in (temporary / "soak-build.jsonl").read_text().splitlines()]
          binaries = [a["executable"] for a in artifacts if a.get("reason") == "compiler-artifact"
                      and a.get("target", {}).get("name") == "social_soak" and a.get("executable")]
          assert len(binaries) == 1, "expected exactly one social soak test binary"
          output = temporary / "soak-binaries"
          output.mkdir()
          shutil.copy2(binaries[0], output / "social_soak")
          shutil.copy2("target/release/vgames-desktop", output / "vgames-desktop")
          PY_BUILD
          tar -czf "$RUNNER_TEMP/soak-binaries.tar.gz" -C "$RUNNER_TEMP/soak-binaries" .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: soak-binaries
          path: ${{ runner.temp }}/soak-binaries.tar.gz
          if-no-files-found: error
          retention-days: 7

  launcher:
    name: Hosted launcher idle soak
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 358
    permissions:
      contents: read
    env:
      HOSTED_HOURS: ${{ inputs.hosted_hours || '5.5' }}
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Soak runtime libraries
        run: scripts/ci/soak-runtime.sh
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: soak-binaries
          path: ${{ runner.temp }}/soak-binaries
      - name: Validate hosted duration and unpack
        run: |
          python3 - <<'PY_DURATION'
          import math, os
          hours = float(os.environ["HOSTED_HOURS"])
          assert math.isfinite(hours) and 0.1 <= hours <= 5.5, "hosted hours must be 0.1-5.5"
          PY_DURATION
          tar -xzf "$RUNNER_TEMP/soak-binaries/soak-binaries.tar.gz" -C "$RUNNER_TEMP/soak-binaries"
      - name: Observe the whole release process tree
        run: |
          xvfb-run -a -s '-screen 0 1280x800x24' \
            python3 apps/desktop/perf/soak.py --binary "$RUNNER_TEMP/soak-binaries/vgames-desktop" \
            --hours "$HOSTED_HOURS" --out "$RUNNER_TEMP/soak" --require-ui-ready --dbus-session
      - name: RSS summary
        if: always()
        run: |
          {
            echo '### Hosted launcher idle soak'
            echo '```json'
            cat "$RUNNER_TEMP/soak/summary.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: launcher-soak-metrics
          path: |
            ${{ runner.temp }}/soak/rss.csv
            ${{ runner.temp }}/soak/summary.json
          if-no-files-found: error
          retention-days: 30

  soak:
    name: Launcher soak (RSS, handles, threads)
    if: vars.VGAMES_SOAK_RUNNER == 'true'
    runs-on: [self-hosted, linux, vgames-soak]
    timeout-minutes: 1560
    permissions:
      contents: read
    env:
      HOURS: ${{ inputs.hours || '24' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate the duration
        run: |
          if ! [[ "$HOURS" =~ ^[0-9]{1,2}$ ]] || [ "$HOURS" -lt 1 ] || [ "$HOURS" -gt 25 ]; then
            echo "::error::hours must be 1-25"; exit 1
          fi
      - name: Build the launcher (release)
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @vgames/desktop build
          cargo build --locked --release -p vgames-desktop
      - name: Soak
        run: |
          script=apps/desktop/perf/soak.py
          if [ ! -f "$script" ]; then
            echo "::error::$script does not exist yet (A2-T14); nothing to run"; exit 1
          fi
          python3 "$script" --binary target/release/vgames-desktop --hours "$HOURS" --out "$RUNNER_TEMP/soak"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: soak-results
          path: ${{ runner.temp }}/soak
          if-no-files-found: ignore
          retention-days: 30

  social:
    needs: build
    name: Social soak (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: chat, test: sustained_chat_keeps_memory_flat, timeout: 358 }
          - { name: idle, test: idle_sockets_stay_up, timeout: 358 }
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: vgames
          POSTGRES_PASSWORD: vgames-soak-only
          POSTGRES_DB: vgames
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vgames -d vgames"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      VGAMES_TEST_DATABASE_URL: postgres://vgames:vgames-soak-only@localhost:5432/postgres
      VGAMES_SOAK_CHAT_SECS: ${{ inputs.chat_secs || '3600' }}
      VGAMES_SOAK_IDLE_SECS: ${{ inputs.idle_secs || '19800' }}
      SQLX_OFFLINE: "true"
      CARGO_INCREMENTAL: "0"
      TEST: ${{ matrix.test }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate the durations
        run: |
          for v in "$VGAMES_SOAK_CHAT_SECS" "$VGAMES_SOAK_IDLE_SECS"; do
            if ! [[ "$v" =~ ^[0-9]{1,5}$ ]] || [ "$v" -lt 60 ] || [ "$v" -gt 19800 ]; then
              echo "::error::durations must be 60-19800 seconds"; exit 1
            fi
          done
      - name: Soak runtime libraries
        run: scripts/ci/soak-runtime.sh
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: soak-binaries
          path: ${{ runner.temp }}/soak-binaries
      - name: Unpack precompiled tests
        run: tar -xzf "$RUNNER_TEMP/soak-binaries/soak-binaries.tar.gz" -C "$RUNNER_TEMP/soak-binaries"
      - name: Require the exact ignored scenario to exist
        run: |
          "$RUNNER_TEMP/soak-binaries/social_soak" --ignored --list --exact "$TEST" > "$RUNNER_TEMP/soak-test-list.txt"
          python3 - <<'PY_TEST'
          import os
          from pathlib import Path
          lines = (Path(os.environ["RUNNER_TEMP"]) / "soak-test-list.txt").read_text().splitlines()
          tests = [line for line in lines if line.endswith(": test")]
          assert tests == [os.environ["TEST"] + ": test"], "expected exactly one ignored social soak scenario"
          PY_TEST
      - name: Soak
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/soak"
          "$RUNNER_TEMP/soak-binaries/social_soak" --ignored --nocapture --exact "$TEST" \
            2>&1 | tee "$RUNNER_TEMP/soak/$TEST.log"
      - name: Summary
        if: always()
        run: |
          {
            echo "### Social soak: $TEST"
            echo '```'
            grep -E "soak:|rss after|rss sample" "$RUNNER_TEMP/soak/$TEST.log" | tail -60 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: social-soak-${{ matrix.name }}
          path: ${{ runner.temp }}/soak
          if-no-files-found: ignore
          retention-days: 30
