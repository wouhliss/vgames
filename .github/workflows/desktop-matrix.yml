# Launcher build + Rust tests on every desktop OS (08-release §1). Owner: Agent 5.
# Unsigned: this proves the launcher and its crates build and pass on Windows,
# Linux and macOS. Signing happens only in release-desktop.yml.
#
# Rules: actions pinned by SHA, no secrets, read-only token, caches keyed by
# lockfiles and saved only from main/schedule runs.

name: Desktop matrix

on:
  pull_request:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: desktop-matrix-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  SQLX_OFFLINE: "true"

jobs:
  changes:
    name: Desktop change detection
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      desktop: ${{ steps.diff.outputs.desktop }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: diff
        env:
          CHANGE_EVENT: ${{ github.event_name }}
          CHANGE_BASE: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/ci/desktop-changes.py

  build:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Windows x64", os: windows-2025, target: x86_64-pc-windows-msvc }
          - { name: "Linux x64", os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { name: "macOS arm64", os: macos-15, target: aarch64-apple-darwin }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: System libraries (Tauri 2 on Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libdbus-1-dev libudev-dev pkg-config build-essential
      - name: Install toolchain (rust-toolchain.toml)
        shell: bash
        run: rustup toolchain install && rustup target add ${{ matrix.target }} && rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: desktop-matrix-${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'schedule' }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the launcher UI (embedded by tauri::generate_context!)
        run: pnpm --filter @vgames/desktop build
      - name: Rust tests (launcher and the crates it ships)
        run: >-
          cargo test --locked --target ${{ matrix.target }}
          -p vgames-desktop -p vgames-core -p vgames-pack -p vgames-transfer -p vgames-overlay
      - name: Release build (unsigned, no bundle)
        run: cargo build --locked --release --target ${{ matrix.target }} -p vgames-desktop

  gate:
    name: Desktop matrix gate
    needs: [changes, build]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require a completed matrix or a deliberate scope skip
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          case "$CHANGES_RESULT:$BUILD_RESULT" in
            success:success|success:skipped) exit 0 ;;
            *) echo "Desktop matrix did not pass: changes=$CHANGES_RESULT, build=$BUILD_RESULT"; exit 1 ;;
          esac
