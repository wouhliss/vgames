name: Controller kernel soak

on:
  pull_request:
    paths:
      - .github/workflows/controller-soak.yml
      - apps/desktop/src-tauri/tests/controllers_uinput.rs
  workflow_dispatch:
  schedule:
    - cron: "23 2 * * 6"

permissions: {}

concurrency:
  group: controller-soak-${{ github.ref }}
  cancel-in-progress: true

jobs:
  controllers:
    name: Two emulated pads for four hours
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    permissions:
      contents: read
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libdbus-1-dev libudev-dev libxss-dev libxtst-dev libxrandr-dev libxcursor-dev libxi-dev libxinerama-dev pkg-config build-essential
          sudo modprobe uinput
      - name: Toolchain
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: controller-kernel-soak
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Embedded launcher UI
        run: pnpm --filter @vgames/desktop build
      - name: Compile as the runner
        run: |
          cargo test --locked -p vgames-desktop --test controllers_uinput --no-run --message-format=json > "$RUNNER_TEMP/controllers-uinput-build.json"
          python3 - "$RUNNER_TEMP/controllers-uinput-build.json" "$RUNNER_TEMP/controllers-uinput-binary" <<'PYTHON'
          import json, sys
          rows = (json.loads(line) for line in open(sys.argv[1]))
          paths = [row["executable"] for row in rows if row.get("reason") == "compiler-artifact" and row.get("target", {}).get("name") == "controllers_uinput" and row.get("executable")]
          assert len(paths) == 1
          open(sys.argv[2], "w").write(paths[0])
          PYTHON
      - name: Four-hour kernel soak
        run: |
          set -o pipefail
          controller_test_binary="$(cat "$RUNNER_TEMP/controllers-uinput-binary")"
          sudo "$controller_test_binary" two_emulated_pads_keep_rss_threads_and_descriptors_flat_for_four_hours --ignored --nocapture 2>&1 | tee "$RUNNER_TEMP/controller-soak.log"
      - name: Preserve measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: controller-kernel-soak
          path: ${{ runner.temp }}/controller-soak.log
          if-no-files-found: warn
          retention-days: 30
