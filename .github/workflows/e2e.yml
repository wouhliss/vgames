name: Windows native password proof
on:
  workflow_dispatch:
permissions: {}
jobs:
  password:
    name: Native password preservation and mutation proof
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Forced slash password, private ACL and failure cleanup
        shell: bash
        run: |
          export VGAMES_DRY_TEST_SHELL
          VGAMES_DRY_TEST_SHELL=$(cygpath -w "$BASH")
          python3 scripts/release/test_dry_build.py
          python3 - <<'PY'
          import os, subprocess
          from pathlib import Path
          source = Path('scripts/release/dry-build.sh')
          original = source.read_bytes()
          for needle, expected in (
              ('  export MSYS2_ARG_CONV_EXCL="$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"', 'Native signing password argument was converted'),
              ('  export MSYS2_ENV_CONV_EXCL=TAURI_SIGNING_PRIVATE_KEY_PASSWORD', 'Native signing password environment was converted'),
          ):
              try:
                  text = original.decode()
                  assert needle in text
                  source.write_text(text.replace(needle, '  # Mutation: omit conversion exclusion.'))
                  result = subprocess.run(['python3', 'scripts/release/test_dry_build.py'],
                      capture_output=True, text=True, timeout=60, env=os.environ)
                  assert result.returncode != 0 and expected in result.stderr, 'Mutation did not fail its exact native password assertion'
                  print('Native password mutation fails its exact preservation assertion.')
              finally:
                  source.write_bytes(original)
          subprocess.run(['python3', 'scripts/release/test_dry_build.py'], check=True)
          PY
      - name: Actual pnpm native argument and environment preservation
        shell: bash
        run: |
          export TAURI_SIGNING_PRIVATE_KEY_PASSWORD=/synthetic-public-argument
          export MSYS2_ARG_CONV_EXCL="$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
          export MSYS2_ENV_CONV_EXCL=TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          pnpm --filter @vgames/desktop exec node ../../scripts/release-argument-proof.mjs "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
