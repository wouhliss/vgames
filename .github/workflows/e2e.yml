name: Windows private-file diagnostic
on:
  workflow_dispatch:
permissions: {}
jobs:
  privacy:
    name: Windows fake-signer privacy and mutation proof
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Actual Git Bash, native private ACL and negative mutation
        shell: bash
        run: |
          export VGAMES_DRY_TEST_SHELL
          VGAMES_DRY_TEST_SHELL=$(cygpath -w "$BASH")
          python3 scripts/release/test_dry_build.py
          python3 - <<'PY'
          import os, subprocess
          from pathlib import Path
          source = Path('scripts/release/dry-build.sh')
          original = source.read_bytes()
          try:
              text = original.decode()
              needle = '$acl.SetAccessRuleProtection($true, $false)'
              assert needle in text
              source.write_text(text.replace(needle, '$acl.SetAccessRuleProtection($false, $true)'))
              result = subprocess.run(['python3', 'scripts/release/test_dry_build.py'],
                  capture_output=True, text=True, timeout=60, env=os.environ)
              assert result.returncode != 0 and 'False is not true' in result.stderr, 'ACL mutation did not fail its privacy assertion'
              print('Native Windows ACL mutation fails the exact privacy assertion.')
          finally:
              source.write_bytes(original)
          subprocess.run(['python3', 'scripts/release/test_dry_build.py'], check=True)
          PY
