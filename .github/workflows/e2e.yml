name: Windows public argument diagnostic
on:
  workflow_dispatch:
permissions: {}
jobs:
  argument:
    name: Native password argument preservation
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Public password value with default Git Bash conversion
        shell: bash
        run: |
          export TAURI_SIGNING_PRIVATE_KEY_PASSWORD=/synthetic-public-argument
          pnpm --filter @vgames/desktop exec node ../../scripts/release-argument-proof.mjs "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
      - name: Public password value with conversion excluded
        if: always()
        shell: bash
        run: |
          export TAURI_SIGNING_PRIVATE_KEY_PASSWORD=/synthetic-public-argument
          export MSYS2_ARG_CONV_EXCL='*'
          export MSYS2_ENV_CONV_EXCL=TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          pnpm --filter @vgames/desktop exec node ../../scripts/release-argument-proof.mjs "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
