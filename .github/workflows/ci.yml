# Continuous integration for every PR and every push to main (08-release §1).
# Owner: Agent 5. Required checks for branch protection: docs/security/ci.md.
#
# Rules: actions pinned by commit SHA; no secrets are used here, so PRs from
# forks run with a read-only token and nothing to steal; caches are keyed by
# lockfiles and only saved from main.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Queries are checked against the committed .sqlx/ data (the `sqlx` job
  # verifies that data against a real database).
  SQLX_OFFLINE: "true"

jobs:
  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: vgames
          POSTGRES_PASSWORD: vgames-ci-only
          POSTGRES_DB: vgames
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vgames -d vgames"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      # #[sqlx::test] creates one throwaway database per test from this URL.
      DATABASE_URL: postgres://vgames:vgames-ci-only@localhost:5432/vgames
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: rust
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: tests
        run: cargo test --locked

  sqlx:
    name: SQLx offline data and migrations
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: vgames
          POSTGRES_PASSWORD: vgames-ci-only
          POSTGRES_DB: vgames
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vgames -d vgames"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      PG: postgres://vgames:vgames-ci-only@localhost:5432
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: sqlx
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Cache sqlx-cli
        id: sqlx-cli
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/sqlx
            ~/.cargo/bin/cargo-sqlx
          key: sqlx-cli-0.9.0-rustls-postgres-${{ runner.os }}
      - name: Install sqlx-cli
        if: steps.sqlx-cli.outputs.cache-hit != 'true'
        run: cargo install sqlx-cli --version 0.9.0 --locked --no-default-features --features rustls,postgres
      - name: Migrations apply to an empty database
        run: |
          sqlx database create --database-url "$PG/ci_empty"
          sqlx migrate run --source apps/api/migrations --database-url "$PG/ci_empty"
      - name: Migrations upgrade from the base revision (merged migrations are never edited)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            BASE_SHA=$(git rev-parse HEAD^)
          fi
          echo "base: $BASE_SHA"
          mkdir -p "$RUNNER_TEMP/base-migrations"
          if git ls-tree -d "$BASE_SHA" apps/api/migrations >/dev/null 2>&1 \
             && [ -n "$(git ls-tree "$BASE_SHA" apps/api/migrations/)" ]; then
            git archive "$BASE_SHA" apps/api/migrations | tar -x -C "$RUNNER_TEMP/base-migrations"
          else
            mkdir -p "$RUNNER_TEMP/base-migrations/apps/api/migrations"
          fi
          sqlx database create --database-url "$PG/ci_upgrade"
          sqlx migrate run --source "$RUNNER_TEMP/base-migrations/apps/api/migrations" --database-url "$PG/ci_upgrade"
          # Fails if a migration applied above was modified (checksum mismatch).
          sqlx migrate run --source apps/api/migrations --database-url "$PG/ci_upgrade"
      - name: Committed .sqlx data matches the queries
        env:
          SQLX_OFFLINE: "false"
          DATABASE_URL: ${{ env.PG }}/ci_empty
        run: cargo sqlx prepare --workspace --check

  changelog:
    name: Changelog fragments
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: xtask
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Every PR adds a valid fragment (08-release §3)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: cargo xtask changelog check --base "$BASE_SHA"
      - name: All fragments are valid
        if: github.event_name != 'pull_request'
        run: cargo xtask changelog lint
      - name: Every file has a code owner; security paths stay with security
        run: cargo xtask codeowners check

  wasm:
    name: WASM (vgames-core, pack-wasm)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain (rust-toolchain.toml, includes wasm32-unknown-unknown)
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: wasm
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: vgames-core for the browser worker
        run: cargo clippy -p vgames-core --features wasm --target wasm32-unknown-unknown --locked -- -D warnings
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: wasm-pack
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: pack-wasm build and smoke test
        run: |
          pnpm --filter @vgames/pack-wasm build
          pnpm --filter @vgames/pack-wasm smoke

  typescript:
    name: TypeScript (Biome, typecheck, Vitest, OpenAPI lint)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm openapi:lint

  desktop-e2e:
    name: Launcher UI end-to-end (mock mode)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @vgames/desktop exec playwright install --with-deps chromium
      - run: pnpm --filter @vgames/desktop e2e
        env:
          CI: "true"
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-e2e-report
          path: apps/desktop/playwright-report
          retention-days: 7

  desktop:
    name: Desktop build check (Linux, WebKitGTK)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: System libraries (Tauri 2 on Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libdbus-1-dev libudev-dev pkg-config build-essential
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: desktop
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the launcher UI (embedded by tauri::generate_context!)
        run: pnpm --filter @vgames/desktop build
      - name: clippy (vgames-desktop)
        run: cargo clippy -p vgames-desktop --all-targets --locked -- -D warnings
      - name: updater tests (vgames-desktop)
        run: "cargo test -p vgames-desktop --lib --locked updater::"

  supply-chain:
    name: Supply chain (cargo-deny, cargo-audit, pnpm audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: cargo-deny,cargo-audit
      - name: cargo deny (advisories, licenses, bans, sources)
        run: cargo deny --workspace --locked check
      - name: cargo audit
        run: cargo audit
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: pnpm audit (production dependencies)
        run: pnpm audit --prod

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan the full history with the vgames rules (.gitleaks.toml)
        run: |
          "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact --no-banner --exit-code 1 .

  workflows:
    name: Workflows (actionlint)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint (pinned, checksum-verified)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/actionlint.tgz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/actionlint.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tgz" -C "$RUNNER_TEMP" actionlint
      - name: Lint every workflow (expressions, permissions, shellcheck of run scripts)
        run: '"$RUNNER_TEMP/actionlint" -no-color'

  dependency-review:
    name: Dependency review
    # Private repositories need GitHub Advanced Security for this action: set the
    # repository variable DEPENDENCY_REVIEW=true once it is available (docs/security/ci.md).
    if: >-
      github.event_name == 'pull_request' &&
      (!github.event.repository.private || vars.DEPENDENCY_REVIEW == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          # Rust licenses are enforced by cargo-deny; here only copyleft is refused.
          deny-licenses: GPL-2.0-only, GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later
